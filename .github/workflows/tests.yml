name: Tes

on:
  # push hanya ke main (mis. setelah PR digabung); semua PR tetap diuji lewat
  # pull_request, sehingga commit di branch PR tidak memicu job ganda.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tidak ada rahasia: tes memakai SQLite sementara dan kunci bawaan development.
      APP_ENV: development
      APP_ENV_FILE: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Jalankan pytest
        run: python -m pytest -q
