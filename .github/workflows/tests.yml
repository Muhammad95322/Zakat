name: Tes

on:
  # push hanya ke main (mis. setelah PR digabung); semua PR tetap diuji lewat
  # pull_request, sehingga commit di branch PR tidak memicu job ganda.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tidak ada rahasia: tes memakai SQLite sementara dan kunci bawaan development.
      APP_ENV: development
      APP_ENV_FILE: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Jalankan pytest
        run: python -m pytest -q

  docker:
    # Bangun image dari Dockerfile (tanpa push ke registry mana pun) lalu uji di dalamnya.
    # Tidak memakai rahasia: kunci untuk docker compose config hanyalah nilai dummy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bangun image
        run: docker build -t zakat-insight:ci .

      - name: Validasi konfigurasi di dalam image
        run: |
          docker run --rm --network none -e APP_ENV=development zakat-insight:ci python scripts/validate_config.py
          # production dengan kunci bawaan harus DITOLAK
          if docker run --rm --network none -e APP_ENV=production zakat-insight:ci python scripts/validate_config.py; then
            echo "validate_config seharusnya menolak APP_ENV=production dengan kunci bawaan"; exit 1
          fi

      - name: Impor semua modul dan jalankan pytest di dalam image
        run: |
          docker run --rm --network none zakat-insight:ci python -c "import importlib, pkgutil, src; [importlib.import_module(m.name) for m in pkgutil.walk_packages(src.__path__, 'src.')]; print('semua modul OK')"
          docker run --rm --network none -e APP_ENV=development -e APP_ENV_FILE= -e MPLBACKEND=Agg zakat-insight:ci python -m pytest -q -p no:cacheprovider

      - name: docker compose config valid dan gagal jelas tanpa APP_SECRET_KEY
        run: |
          APP_SECRET_KEY=kunci-dummy-hanya-untuk-validasi-ci-0123456789 docker compose config --quiet
          if docker compose config --quiet 2> compose.err; then
            echo "docker compose config seharusnya gagal tanpa APP_SECRET_KEY"; exit 1
          fi
          grep -q "APP_SECRET_KEY" compose.err

  keamanan:
    # Pemindaian keamanan tanpa rahasia: kerentanan dependensi terkunci (pip-audit) dan analisis statis (bandit).
    # Pengecualian dicatat di kode dengan "# nosec <ID>" beserta alasan; pemeriksaan tidak dimatikan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Pasang alat
        run: python -m pip install --upgrade pip pip-audit bandit

      - name: pip-audit (requirements + constraints)
        run: pip-audit -r requirements.txt -r constraints.txt

      - name: bandit (src/)
        run: bandit -r src/
