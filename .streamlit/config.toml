# Konfigurasi Streamlit untuk semua lingkungan (audit keamanan S7, R5).
[server]
# Perlindungan XSRF (bawaan aktif; ditulis eksplisit agar tidak dimatikan tanpa sengaja)
enableXsrfProtection = true
enableCORS = true
# Cookie XSRF hanya dikirim untuk permintaan dari situs yang sama. Catatan: Streamlit hanya memasang flag
# Secure bila Streamlit sendiri menangani SSL; di belakang proxy TLS Render flag itu tidak terpasang.
# Aplikasi TIDAK memakai cookie untuk autentikasi (token disimpan di sesi server).
xsrfCookieSameSite = "strict"
# Selaras dengan MAX_UPLOAD_SIZE_MB aplikasi (bawaan Streamlit 200 MB)
maxUploadSize = 50
headless = true

[client]
# Jangan tampilkan stack trace/jalur berkas server ke pengguna; detail tetap di log server
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
# Matikan telemetri penggunaan ke pihak ketiga
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#14705E"
backgroundColor = "#F5F6F3"
secondaryBackgroundColor = "#EBEEEA"
textColor = "#1A2421"
font = "sans-serif"
baseRadius = "small"
redColor = "#B3382C"
orangeColor = "#B7791F"
yellowColor = "#B7791F"
greenColor = "#14705E"
blueColor = "#3B6A8C"

[theme.sidebar]
backgroundColor = "#12332E"
secondaryBackgroundColor = "#1B4A42"
textColor = "#E6EFEB"
primaryColor = "#E3A33B"
