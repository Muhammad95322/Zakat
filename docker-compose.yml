# CATATAN KEAMANAN
# - APP_SECRET_KEY WAJIB diisi dari environment / file .env (tidak ada nilai bawaan).
#   Contoh: export APP_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
# - Nilai bawaan POSTGRES_PASSWORD dan PGADMIN_PASSWORD di bawah HANYA untuk
#   pengembangan lokal. Override lewat environment untuk server mana pun:
#   POSTGRES_PASSWORD=... PGADMIN_PASSWORD=... docker compose up -d
services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?Set APP_SECRET_KEY di environment atau file .env (minimal 32 karakter acak)}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zakat}:${POSTGRES_PASSWORD:-zakat_lokal_saja}@db:5432/${POSTGRES_DB:-zakat_insight}
      - UPLOAD_DIR=/app/uploads
      # Alamat publik untuk tautan email; SMTP opsional (tanpa SMTP email tidak dikirim)
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8501}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASS=${EMAIL_SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@zakatinsight.id}
    volumes:
      # Volume bernama (bukan bind mount) agar dapat ditulis pengguna non-root di container
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zakat_insight}
      POSTGRES_USER: ${POSTGRES_USER:-zakat}
      # Bawaan hanya untuk lokal; override dengan POSTGRES_PASSWORD
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zakat_lokal_saja}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zakat} -d ${POSTGRES_DB:-zakat_insight}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@zakatinsight.id}
      # Bawaan hanya untuk lokal; override dengan PGADMIN_PASSWORD
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_lokal_saja}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  uploads_data:
