services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://zakat:zakatpass@db:5432/zakat_insight
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zakat_insight
      POSTGRES_USER: zakat
      POSTGRES_PASSWORD: zakatpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakat -d zakat_insight"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zakatinsight.id
      PGADMIN_DEFAULT_PASSWORD: pgadmin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:

