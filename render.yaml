services:
  - type: web
    name: zakat-insight
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/validate_config.py && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zakat-insight-db
          property: connectionString
      - key: EMAIL_ENABLED
        value: false

databases:
  - name: zakat-insight-db
    plan: free
    databaseName: zakat_insight
    user: zakat

